[project]
name = "meowcall-repo"
version = "2.0.0"
description = "MeowCall Discord bot application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "db",
    "discord-py>=2.5.0",
    "aiohttp>=3.11.0",
    "python-dotenv>=1.0.1",
    "cachetools>=5.5.0",
    "aiosqlite>=0.21.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "cuid2>=2.0.1",
    "asyncpg>=0.31.0",
    "redis>=7.4.0",
    "rich>=15.0.0",
    "sentry-sdk>=2.58.0",
    "jishaku>=2.7.5",
    "alembic>=1.18.4",
    "atlas-provider-sqlalchemy>=0.5.0",
    "psycopg2-binary>=2.9.12", # Changed to -binary to avoid pg_config errors
    "psutil>=7.2.2",
    "faker>=40.15.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.uv.workspace]
members = ["apps/bot", "packages/db", "packages/dbSupport"]

[tool.ruff.lint.per-file-ignores]
"apps/bot/tests/*.py" = ["E402"]

[tool.uv.sources]
db = { workspace = true }

[tool.uv]
managed = true
